<text x="360.0" y="53" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">FunctionDef node</text>
<text x="360.0" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">int add(int a, int b) {…}</text>
<rect x="256" y="112" width="208" height="64" rx="6" fill="#f5f5f5"/>
<rect x="256" y="112" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360.0" y="134" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">functionSignature()</text>
<text x="360.0" y="149" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolveType(): function type</text>
<text x="360.0" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">declare or match the symbol</text>
<polygon points="360,200 488,256 360,312 232,256" fill="#f5f5f5"/>
<polygon points="360,200 488,256 360,312 232,256" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360" y="254" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">body already</text>
<text x="360" y="268" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">seen (isDefined)?</text>
<rect x="592" y="228" width="224" height="56" rx="28" fill="#f5f5f5"/>
<rect x="592" y="228" width="224" height="56" rx="28" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="704.0" y="253" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">redefinition of function</text>
<text x="704.0" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error; body is not analysed</text>
<rect x="256" y="344" width="208" height="64" rx="6" fill="#f5f5f5"/>
<rect x="256" y="344" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360.0" y="366" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">enterScope(Function)</text>
<text x="360.0" y="381" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">declare the parameters</text>
<text x="360.0" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">collectLabels(), FunctionCtx</text>
<rect x="256" y="432" width="208" height="56" rx="6" fill="#f5f5f5"/>
<rect x="256" y="432" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360.0" y="457" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">blockItems(body)</text>
<text x="360.0" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">each return is checked</text>
<polygon points="360,512 488,568 360,624 232,568" fill="#f5f5f5"/>
<polygon points="360,512 488,568 360,624 232,568" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360" y="566" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">non-void, and</text>
<text x="360" y="580" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">no return at all?</text>
<rect x="592" y="540" width="224" height="56" rx="28" fill="#f5f5f5"/>
<rect x="592" y="540" width="224" height="56" rx="28" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="704.0" y="565" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">warning: no return</text>
<text x="704.0" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">analysis continues</text>
<rect x="256" y="656" width="208" height="56" rx="28" fill="#f5f5f5"/>
<rect x="256" y="656" width="208" height="56" rx="28" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
<text x="360.0" y="681" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">exitScope()</text>
<text x="360.0" y="696" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">params, locals, bodyScopeId set</text>
<line x1="32" y1="752" x2="928" y2="752" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="32" y="768" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="32" y="784" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="68" y="794" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Start / outcome</text>
<rect x="168" y="784" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="204" y="794" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Step (declarations.cpp)</text>
<polygon points="344,790 356,784 368,790 356,796" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="380" y="794" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Decision</text>
<rect x="448" y="784" width="24" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
<text x="484" y="794" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Function symbol complete</text>
      </svg>
