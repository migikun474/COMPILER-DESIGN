<text x="380.0" y="331" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="526.0" y="548" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="540" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="368" y="634" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="380.0" y="643" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
