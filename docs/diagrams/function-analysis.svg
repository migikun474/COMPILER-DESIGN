<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="function-analysis-title function-analysis-desc" id="function-analysis-root">
        <title id="function-analysis-title">Semantic analysis of a function definition</title>
        <desc id="function-analysis-desc">A function definition is registered by functionSignature, rejected if it already has a body, then its scope is entered, parameters and labels are declared, the body is analysed and the scope is left.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #function-analysis-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #function-analysis-root { font-family: var(--font-sans); color: var(--color-ink); }
      #function-analysis-root .diagram-container { width: 100%; overflow-x: auto; }
      #function-analysis-root .diagram-container { overflow-x: visible; }</style>
          <marker id="function-analysis-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="function-analysis-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="function-analysis-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="360" y1="80" x2="360" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="360" y1="176" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="488" y1="256" x2="592" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="360" y1="312" x2="360" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="360" y1="408" x2="360" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="360" y1="488" x2="360" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="488" y1="568" x2="592" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<line x1="360" y1="624" x2="360" y2="656" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
<path d="M 704,596 V 676 Q 704,684 696,684 H 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#function-analysis-arrow)"/>
