<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lexer-dataflow-title lexer-dataflow-desc" id="lexer-dataflow-root">
        <title id="lexer-dataflow-title">Lexer data flow</title>
        <desc id="lexer-dataflow-desc">Source text is preprocessed, scanned by one yylex call that looks identifiers up in the keyword map, collects tokens and diagnostics, and prints either the token table or every error.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #lexer-dataflow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lexer-dataflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lexer-dataflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #lexer-dataflow-root .diagram-container { overflow-x: visible; }</style>
