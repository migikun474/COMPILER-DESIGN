<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The scope tree for add.c</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · semantic symbol table</p>
    <h1>The scope tree for add.c</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="symbol-table-architecture-title symbol-table-architecture-desc">
        <title id="symbol-table-architecture-title">The scope tree for add.c</title>
        <desc id="symbol-table-architecture-desc">Nested scopes of the example program: the global scope contains the function scopes of add and main, and main contains a block scope whose x shadows the outer x.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="64" width="880" height="432" rx="8" fill="#f5f5f5"/>
<rect x="40" y="64" width="880" height="432" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
<rect x="56" y="58" width="100" height="12" rx="2" fill="#f5f5f5"/>
<text x="106.0" y="67" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCOPE 0 · GLOBAL</text>
<text x="72" y="104" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">global</text>
<text x="136" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">variable</text>
<text x="208" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="312" y="104" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">global</text>
<text x="72" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">add</text>
<text x="136" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">function</text>
<text x="208" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int (int, int)</text>
<text x="312" y="120" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">_Z3addii</text>
<text x="72" y="136" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">main</text>
<text x="136" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">function</text>
<text x="208" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int (void)</text>
<text x="312" y="136" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">main</text>
<text x="512" y="110" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">Leaving a scope only pops it off the active stack;</text>
<text x="512" y="130" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start" font-style="italic">inside the block the stack is 0, 2, 3 and lookup walks it backwards.</text>
<rect x="72" y="192" width="376" height="272" rx="8" fill="#f5f5f5"/>
<rect x="72" y="192" width="376" height="272" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/>
<rect x="88" y="186" width="140" height="12" rx="2" fill="#f5f5f5"/>
<text x="158.0" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCOPE 1 · FUNCTION add()</text>
<text x="104" y="232" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">a</text>
<text x="168" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">parameter</text>
<text x="240" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="344" y="232" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">a.1</text>
<text x="104" y="248" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">b</text>
<text x="168" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">parameter</text>
<text x="240" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="344" y="248" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">b.2</text>
<text x="104" y="264" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">result</text>
<text x="168" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">variable</text>
<text x="240" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="344" y="264" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">result.3</text>
<text x="104" y="296" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">parameters and the body's own</text>
<text x="104" y="308" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">declarations share this scope</text>
<rect x="480" y="192" width="408" height="272" rx="8" fill="#f5f5f5"/>
<rect x="480" y="192" width="408" height="272" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/>
<rect x="496" y="186" width="148" height="12" rx="2" fill="#f5f5f5"/>
<text x="570.0" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCOPE 2 · FUNCTION main()</text>
<text x="512" y="232" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">x</text>
<text x="576" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">variable</text>
<text x="648" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="752" y="232" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">x.4</text>
<rect x="512" y="288" width="344" height="144" rx="8" fill="#f5f5f5"/>
<rect x="512" y="288" width="344" height="144" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="528" y="282" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="576.0" y="291" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCOPE 3 · BLOCK</text>
<text x="544" y="328" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">x</text>
<text x="608" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">variable</text>
<text x="680" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">int</text>
<text x="784" y="328" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">x.5</text>
<text x="544" y="360" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">shadows x.4: lookup("x") stops here first</text>
<text x="544" y="388" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">global = add(x, 4);</text>
<text x="544" y="404" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">uses x.5, add in scope 0, global in scope 0</text>
<line x1="32" y1="532" x2="928" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND · docs/examples/add.c</text>
<rect x="32" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="68" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Scope: names map + tags map, kept after it closes</text>
<rect x="332" y="564" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="368" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Innermost active scope</text>
      </svg>
    </div>
  </div>
</body>
</html>
