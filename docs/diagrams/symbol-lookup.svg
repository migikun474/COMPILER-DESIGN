<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="symbol-lookup-title symbol-lookup-desc" id="symbol-lookup-root">
        <title id="symbol-lookup-title">How a name is looked up</title>
        <desc id="symbol-lookup-desc">Lookup starts in the innermost active scope and moves outward one scope at a time until the name is found or the stack is exhausted, in which case the identifier is undeclared.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #symbol-lookup-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #symbol-lookup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #symbol-lookup-root .diagram-container { width: 100%; overflow-x: auto; }
      #symbol-lookup-root .diagram-container { overflow-x: visible; }</style>
          <marker id="symbol-lookup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="symbol-lookup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="symbol-lookup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="400" y1="88" x2="400" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<line x1="400" y1="168" x2="400" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<line x1="528" y1="256" x2="640" y2="256" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#symbol-lookup-arrow-accent)"/>
<line x1="400" y1="312" x2="400" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<line x1="272" y1="408" x2="232" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<path d="M 136,384 V 264 Q 136,256 144,256 H 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<line x1="400" y1="464" x2="400" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#symbol-lookup-arrow)"/>
<rect x="570.0" y="236" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="584" y="245" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="408" y="326" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="420.0" y="335" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="238.0" y="388" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="252" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="408" y="478" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="420.0" y="487" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<text x="48" y="208" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">a Record scope searches the class instead:</text>
<text x="48" y="222" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">lookupMember(): members, then base classes</text>
<rect x="296" y="40" width="208" height="48" rx="24" fill="#f5f5f5"/>
<rect x="296" y="40" width="208" height="48" rx="24" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="400.0" y="61" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">lookup(name)</text>
<text x="400.0" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SymbolTable::lookup</text>
<rect x="296" y="120" width="208" height="48" rx="6" fill="#f5f5f5"/>
<rect x="296" y="120" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="400.0" y="141" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">scope = top of stack_</text>
<text x="400.0" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">innermost active scope</text>
<polygon points="400,200 528,256 400,312 272,256" fill="#f5f5f5"/>
<polygon points="400,200 528,256 400,312 272,256" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="400" y="254" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">name declared</text>
<text x="400" y="268" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">in this scope?</text>
<rect x="640" y="228" width="224" height="56" rx="28" fill="#f5f5f5"/>
<rect x="640" y="228" width="224" height="56" rx="28" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
<text x="752.0" y="253" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">return the symbols</text>
<text x="752.0" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every overload of the name</text>
<polygon points="400,352 528,408 400,464 272,408" fill="#f5f5f5"/>
<polygon points="400,352 528,408 400,464 272,408" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="400" y="406" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">outer scope left</text>
<text x="400" y="420" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">on the stack?</text>
<rect x="40" y="384" width="192" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="384" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="136.0" y="405" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">move to the enclosing scope</text>
<text x="136.0" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parent of this scope</text>
<rect x="296" y="504" width="208" height="56" rx="28" fill="#f5f5f5"/>
<rect x="296" y="504" width="208" height="56" rx="28" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="400.0" y="529" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">not visible</text>
<text x="400.0" y="544" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">identifier(): undeclared</text>
<line x1="32" y1="600" x2="928" y2="600" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="32" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="32" y="632" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
<text x="68" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Start / end</text>
<rect x="148" y="632" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="184" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Step</text>
<polygon points="232,638 244,632 256,638 244,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="268" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Decision</text>
<line x1="336" y1="638" x2="364" y2="638" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#symbol-lookup-arrow-accent)"/>
<text x="372" y="642" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Name resolved</text>
      </svg>
