<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexer data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · phase 1</p>
    <h1>Lexer data flow</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lexer-dataflow-title lexer-dataflow-desc">
        <title id="lexer-dataflow-title">Lexer data flow</title>
        <desc id="lexer-dataflow-desc">Source text is preprocessed, scanned by one yylex call that looks identifiers up in the keyword map, collects tokens and diagnostics, and prints either the token table or every error.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="152" y1="260" x2="192" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="320" y1="260" x2="360" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="528" y1="260" x2="616" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="744" y1="260" x2="800" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="444" y1="232" x2="444" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 444,288 V 372 Q 444,380 452,380 H 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="744" y1="380" x2="800" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="552.0" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="572" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>
<rect x="452" y="194" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="476.0" y="203" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP</text>
<rect x="516.0" y="360" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="536" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERROR</text>
<rect x="40" y="232" width="112" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="232" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="96.0" y="257" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Source file</text>
<text x="96.0" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file.c</text>
<rect x="192" y="232" width="128" height="56" rx="6" fill="#f5f5f5"/>
<rect x="192" y="232" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="256.0" y="257" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Preprocessor</text>
<text x="256.0" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">openPreprocessed()</text>
<rect x="360" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="360" y="232" width="168" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="444.0" y="257" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">yylex() · Flex DFA</text>
<text x="444.0" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">longest match · 4 states</text>
<rect x="360" y="112" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="360" y="112" width="168" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="444.0" y="137" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Keyword / operator maps</text>
<text x="444.0" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reserved_word()</text>
<rect x="616" y="232" width="128" height="56" rx="6" fill="#f5f5f5"/>
<rect x="616" y="232" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="680.0" y="257" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">tokens vector</text>
<text x="680.0" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">addToken()</text>
<rect x="800" y="232" width="128" height="56" rx="6" fill="#f5f5f5"/>
<rect x="800" y="232" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="864.0" y="257" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token table</text>
<text x="864.0" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stdout, if no errors</text>
<rect x="616" y="352" width="128" height="56" rx="6" fill="#f5f5f5"/>
<rect x="616" y="352" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="680.0" y="377" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">g_diagnostics</text>
<text x="680.0" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reportError()</text>
<rect x="800" y="352" width="128" height="56" rx="6" fill="#f5f5f5"/>
<rect x="800" y="352" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="864.0" y="377" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Error report</text>
<text x="864.0" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stderr, all errors</text>
<line x1="32" y1="532" x2="928" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="32" y="564" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="68" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">The scanner (src/lexer.l)</text>
<rect x="216" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="252" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Data structure</text>
<rect x="348" y="564" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="384" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Output</text>
<rect x="440" y="564" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="476" y="574" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">Input</text>
      </svg>
    </div>
  </div>
</body>
</html>
