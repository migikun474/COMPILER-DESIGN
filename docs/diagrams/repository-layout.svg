<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repository-layout-title repository-layout-desc" id="repository-layout-root">
        <title id="repository-layout-title">Project layout</title>
        <desc id="repository-layout-desc">Folder tree of the project: the shared library, the three implemented phase folders and the two planned back-end folders that contain only a README.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #repository-layout-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #repository-layout-root { font-family: var(--font-sans); color: var(--color-ink); }
      #repository-layout-root .diagram-container { width: 100%; overflow-x: auto; }
      #repository-layout-root .diagram-container { overflow-x: visible; }</style>
