<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="type-checking-title type-checking-desc" id="type-checking-root">
        <title id="type-checking-title">Type checking x = y + z</title>
        <desc id="type-checking-desc">The analyzer resolves x, y and z through the symbol table, computes the type of y + z with the usual arithmetic conversions, checks that x is assignable, and asks the type system whether the value converts to the type of x.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #type-checking-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #type-checking-root { font-family: var(--font-sans); color: var(--color-ink); }
      #type-checking-root .diagram-container { width: 100%; overflow-x: auto; }
      #type-checking-root .diagram-container { overflow-x: visible; }</style>
