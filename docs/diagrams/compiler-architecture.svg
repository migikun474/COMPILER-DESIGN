        <title id="compiler-architecture-title">Compiler pipeline: what exists today</title>
        <desc id="compiler-architecture-desc">Pipeline from source file through preprocessor, lexer, parser and semantic analysis, all implemented, to TAC and MIPS generation, which are planned and have no code.</desc>
