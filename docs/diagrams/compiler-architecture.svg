      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #compiler-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #compiler-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #compiler-architecture-root .diagram-container { overflow-x: visible; }</style>
